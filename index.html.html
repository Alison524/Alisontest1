<meta charset="UTF-8" data-inspector-id="html:350985fc:2">
<meta name="viewport" content="width=device-width, initial-scale=1" data-inspector-id="html:350985fc:3">
<title>测一测，TA 是不是也在偷偷喜欢你</title>
<style>
  :root{
    --pink:#FF6B8A;
    --pink-soft:#FFD6DE;
    --peach:#FFB199;
    --cream:#FFF5F3;
    --ink:#4A3B3F;
    --ink-soft:#8A7378;
    --card:#FFFFFF;
    --line:#F3E2E5;
    --shadow:0 12px 32px rgba(255,107,138,.16);
    --radius:22px;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:linear-gradient(160deg,#FFF5F3 0%,#FFE9EC 55%,#FFEFE6 100%);
    color:var(--ink);
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  .stage{
    width:100%;
    max-width:480px;
    min-height:100vh;
    position:relative;
    padding:24px 20px 40px;
    overflow:hidden;
  }
  /* 装饰漂浮爱心 */
  .deco{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
  .deco span{position:absolute;opacity:.18;}
  .deco svg{display:block;}
  .deco .d1{top:8%;left:-14px;transform:rotate(-18deg);}
  .deco .d2{top:22%;right:-18px;transform:rotate(14deg);}
  .deco .d3{bottom:16%;left:-10px;transform:rotate(10deg);}
  .deco .d4{bottom:30%;right:-12px;transform:rotate(-12deg);}

  .view{position:relative;z-index:1;display:none;animation:fade .35s ease;}
  .view.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

  /* ===== 首页 ===== */
  .hero{text-align:center;padding-top:26px;}
  .hero .badge{
    display:inline-flex;align-items:center;gap:6px;
    background:var(--card);border:1px solid var(--line);
    color:var(--pink);font-size:13px;font-weight:600;
    padding:7px 14px;border-radius:999px;box-shadow:var(--shadow);
  }
  .hero h1{
    margin:22px 0 14px;font-size:30px;line-height:1.35;font-weight:800;
    letter-spacing:.5px;
  }
  .hero h1 .hl{color:var(--pink);}
  .hero .sub{font-size:15px;color:var(--ink-soft);line-height:1.7;}
  .tags{margin:28px 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .tag{
    background:var(--card);border:1px solid var(--line);border-radius:18px;
    padding:16px 14px;text-align:left;box-shadow:0 6px 18px rgba(180,120,130,.10);
  }
  .tag .t-head{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;margin-bottom:6px;}
  .tag .t-head svg{flex:none;}
  .tag .t-desc{font-size:12.5px;color:var(--ink-soft);line-height:1.6;}
  .cta{
    width:100%;border:none;cursor:pointer;
    background:linear-gradient(120deg,var(--pink),var(--peach));
    color:#fff;font-size:18px;font-weight:700;letter-spacing:2px;
    padding:17px;border-radius:999px;box-shadow:var(--shadow);
    transition:transform .15s ease;
  }
  .cta:active{transform:scale(.97);}
  .foot{margin-top:18px;text-align:center;font-size:12px;color:var(--ink-soft);line-height:1.6;}

  /* ===== 答题 ===== */
  .quiz-top{margin-bottom:18px;}
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--ink-soft);margin-bottom:10px;}
  .quiz-meta .num{font-weight:700;color:var(--pink);}
  .progress{height:8px;background:var(--pink-soft);border-radius:999px;overflow:hidden;}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--pink),var(--peach));border-radius:999px;transition:width .3s ease;}
  .q-card{background:var(--card);border-radius:var(--radius);padding:24px 20px;box-shadow:var(--shadow);}
  .q-title{font-size:19px;font-weight:700;line-height:1.6;margin-bottom:22px;}
  .opts{display:flex;flex-direction:column;gap:13px;}
  .opt{
    display:flex;align-items:flex-start;gap:12px;
    background:#FFF8F9;border:1px solid var(--line);border-radius:16px;
    padding:15px 16px;cursor:pointer;text-align:left;width:100%;
    font-size:15px;color:var(--ink);line-height:1.6;transition:all .15s ease;
  }
  .opt .dot{
    flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--pink-soft);

/* ===== 状态与逻辑 ===== */
let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);

const $ = id => document.getElementById(id);
const views = {home:$("view-home"), quiz:$("view-quiz"), result:$("view-result")};

function show(name){
  Object.values(views).forEach(v=>v.classList.remove("active"));
  views[name].classList.add("active");
  window.scrollTo({top:0,behavior:"smooth"});
}

function start(){
  current = 0;
  answers = new Array(QUESTIONS.length).fill(null);
  renderQuestion();
  show("quiz");
}

function renderQuestion(){
  const q = QUESTIONS[current];
  $("q-num").textContent = `第 ${current+1} / ${QUESTIONS.length} 题`;
  $("q-bar").style.width = ((current)/QUESTIONS.length*100) + "%";
  $("q-title").textContent = q.title;
  const box = $("q-opts");
  box.innerHTML = "";
  q.options.forEach((op, i)=>{
    const btn = document.createElement("button");
    btn.className = "opt" + (answers[current]===i ? " sel" : "");
    btn.innerHTML = `<span class="dot"><svg width="12" height="12" viewBox="0 0 24 24" fill="#fff"><path d="M9 16.2l-3.5-3.5L4 14.2 9 19.2 20 8.2l-1.5-1.5z"/></svg></span><span class="txt">${op.text}</span>`;
    btn.addEventListener("click", ()=>{
      answers[current] = i;
      box.querySelectorAll(".opt").forEach((el,idx)=>el.classList.toggle("sel",idx===i));
      setTimeout(()=>{
        if(current < QUESTIONS.length-1){ current++; renderQuestion(); }
        else{ finish(); }
      }, 220);
    });
    box.appendChild(btn);
  });
}

$("btn-back").addEventListener("click", ()=>{
  if(current>0){ current--; renderQuestion(); }
});

function finish(){
  const score = {};
  QUESTIONS.forEach((q,i)=>{
    const r = q.options[answers[i]].result;
    score[r] = (score[r]||0)+1;
  });
  let best = 1, max = -1;
  Object.keys(score).forEach(k=>{
    if(score[k]>max){ max=score[k]; best=Number(k); }
  });
  const r = RESULTS[best];
  $("res-badge").textContent = "匹配结果 · " + r.title;
  $("res-title").textContent = r.title;
  $("res-sub").textContent = r.sub;
  $("res-desc").textContent = r.desc;
  $("res-icon").innerHTML = `<svg width="56" height="56" viewBox="0 0 24 24" fill="#FF6B8A"><path d="M12 21s-7.5-4.9-10-9.2C.3 8.6 2.3 5 5.7 5c2 0 3.4 1.1 4.3 2.4h4c.9-1.3 2.3-2.4 4.3-2.4 3.4 0 5.4 3.6 3.7 6.8C19.5 16.1 12 21 12 21z"/></svg>`;
  $("q-bar").style.width = "100%";
  show("result");
}

$("btn-start").addEventListener("click", start);
$("btn-restart").addEventListener("click", ()=>show("home"));
</script>
