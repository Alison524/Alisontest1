<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>心动小测试 | TA是不是也在偷偷喜欢你</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        pinkMain: '#ff6b8b',
                        pinkLight: '#ffe7ec',
                    },
                    fontFamily: {
                        sans: ['system-ui', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style type="text/tailwindcss">
        @layer utilities {
            .bg-heart {
                background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 10c-4-4-10-4-14 0s-4 10 0 14l14 14 14-14c4-4 4-10 0-14s-10-4-14 0z' fill='%23ffd6e0' fill-opacity='0.4'/%3E%3C/svg%3E");
            }
            .btn-gradient {
                background: linear-gradient(90deg, #ff5e7d, #ff9c8c);
            }
        }
    </style>
</head>
<body class="bg-[#ffe7ec] bg-heart min-h-screen">
    <div id="home" class="px-5 py-16 max-w-xl mx-auto">
        <div class="text-center">
            <span class="inline-block bg-white text-pinkMain px-4 py-1 rounded-full text-sm shadow-sm mb-6">❤️ 心动小测试</span>
            <h2 class="text-[clamp(1.7rem,5vw,2.2rem)] font-bold text-gray-800">测一测，</h2>
            <h1 class="text-[clamp(2rem,6vw,2.6rem)] font-bold text-pinkMain mt-1">TA 是不是也在偷偷喜欢你</h1>
            <p class="text-gray-500 mt-3 text-sm">凭你的心动细节，匹配 TA 的真实心意</p>

            <div class="grid grid-cols-2 gap-4 mt-10">
                <div class="bg-white rounded-xl p-4 shadow-sm">
                    <p class="text-pinkMain font-medium text-sm"><i class="fa fa-heart mr-1"></i>心动细节</p>
                    <p class="text-gray-400 text-xs mt-1">每个举动都有答案</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm">
                    <p class="text-pinkMain font-medium text-sm"><i class="fa fa-heart mr-1"></i>聊天温度</p>
                    <p class="text-gray-400 text-xs mt-1">回复速度藏着态度</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm">
                    <p class="text-pinkMain font-medium text-sm"><i class="fa fa-heart mr-1"></i>暧昧浓度</p>
                    <p class="text-gray-400 text-xs mt-1">你们现在到哪一步</p>
                </div>
                <div class="bg-white rounded-xl p-4 shadow-sm">
                    <p class="text-pinkMain font-medium text-sm"><i class="fa fa-heart mr-1"></i>心意解读</p>
                    <p class="text-gray-400 text-xs mt-1">TA心里到底怎么看你</p>
                </div>
            </div>

            <button onclick="startTest()" class="btn-gradient w-full py-4 rounded-full text-white font-bold text-lg mt-10 shadow-lg">
                点击测试
            </button>
            <p class="text-gray-400 text-xs mt-4">趣味测试仅供娱乐，别拿结果去质问 TA</p>
        </div>
    </div>

    <div id="questionBox" class="hidden px-5 py-12 max-w-xl mx-auto min-h-screen">
        <div class="bg-white rounded-2xl p-6 shadow-md">
            <div class="flex justify-between items-center mb-4">
                <span class="text-pinkMain font-medium">题目 <span id="qIndex">1</span>/32</span>
                <div class="h-2 w-28 bg-gray-100 rounded-full overflow-hidden">
                    <div id="progressBar" class="h-full bg-pinkMain w-[3.125%]"></div>
                </div>
            </div>
            <h3 id="qTitle" class="text-gray-800 font-semibold text-lg mb-6"></h3>
            <div id="optionList" class="space-y-3"></div>
        </div>
    </div>

    <div id="resultBox" class="hidden px-5 py-12 max-w-xl mx-auto min-h-screen">
        <div class="bg-white rounded-2xl p-7 shadow-md text-center">
            <div class="text-5xl mb-4" id="resEmoji">💗</div>
            <h2 id="resTitle" class="text-xl font-bold text-pinkMain"></h2>
            <p id="resDesc" class="text-gray-600 mt-4 text-sm leading-relaxed"></p>
            <button onclick="restart()" class="btn-gradient w-full py-3 rounded-full text-white font-bold mt-8">重新测试</button>
        </div>
    </div>

<script>
const questions = [
    {title:"TA会不会主动找话题和你聊天？",opts:["经常主动","偶尔主动","很少，基本我找TA","从来不主动"]},
    {title:"TA回复你的消息速度？",opts:["很快，大多几分钟内","一般，半小时左右","经常隔很久才回","经常已读不回"]},
    {title:"TA会不会记住你随口说的小事？",opts:["会，记得很清楚","偶尔记得","很少记住","完全没印象"]},
    {title:"TA会不会主动关心你的情绪和状态？",opts:["经常关心","偶尔关心","只有我提了才关心","从不关心"]},
    {title:"你们线下见面时TA眼神？",opts:["经常偷偷看你、对视害羞","会正常对视聊天","很少看你","刻意避开眼神"]},
    {title:"TA愿意单独和你见面吗？",opts:["很乐意主动约","你约一般会来","找理由推脱","直接拒绝单独见面"]},
    {title:"TA会不会对你分享日常琐事？",opts:["经常碎碎念分享","偶尔分享","只聊正事","几乎不分享私人生活"]},
    {title:"TA会不会吃你的醋？",opts:["明显会吃醋、不开心","隐约有点在意","无感，无所谓","觉得和TA无关"]},
    {title:"TA在朋友面前提起你的时候？",opts:["主动提到你、夸你","别人问才说你","不太愿意提起","刻意避开聊你"]},
    {title:"TA会不会照顾你的喜好、迁就你？",opts:["主动迁就照顾","偶尔迁就","很少迁就","优先自己舒服"]},
    {title:"深夜的时候，你们会聊天吗？",opts:["经常深夜长聊","偶尔聊一会","很少深夜聊天","深夜基本不回消息"]},
    {title:"TA会不会对你有特殊昵称？",opts:["专属昵称","叫名字小名","只叫全名","称呼很客气疏远"]},
    {title:"TA会不会留意你的社交动态？",opts:["每条都会看、点赞评论","偶尔点赞","很少看你的动态","完全不关注"]},
    {title:"吵架或者冷淡之后，谁先缓和？",opts:["TA主动低头哄你","双方轮流让步","基本都是你主动","TA冷处理不妥协"]},
    {title:"TA会不会规划和你的未来小事？",opts:["主动提一起以后的计划","偶尔随口提","只聊当下","从来不会提"]},
    {title:"TA愿意把你介绍给好朋友吗？",opts:["主动介绍给朋友","你要求才介绍","不太愿意","不想让别人知道你们来往"]},
    {title:"TA和你聊天会不会发暧昧表情包？",opts:["经常发暧昧温柔的","偶尔发可爱的","只发普通表情","很少发表情包"]},
    {title:"TA会不会对你有肢体靠近（不越界）？",opts:["自然靠近、不经意接触","偶尔近距离","刻意保持距离","明显回避靠近"]},
    {title:"你难过的时候TA反应？",opts:["认真安抚、心疼你","简单安慰两句","说几句客套话","无动于衷"]},
    {title:"TA会不会找借口来见你？",opts:["经常制造机会见面","偶尔找机会","需要你创造机会","不愿多见"]},
    {title:"TA会不会吃醋打探你的异性朋友？",opts:["主动打听、很在意","旁敲侧击问一点","不在意你的异性朋友","反感你问TA异性关系"]},
    {title:"TA会不会记住你的生日、重要日子？",opts:["记得还准备小惊喜","记得但不特意准备","会忘记","根本不知道"]},
    {title:"聊天结束，一般是谁收尾？",opts:["TA舍不得结束，找续话","轮流收尾","大多是你收尾","TA直接消失不道别"]},
    {title:"TA会不会愿意为你花时间？",opts:["愿意挤出时间陪你","有空才陪你","很忙就直接忽略你","永远没时间"]},
    {title:"TA对你和对其他人一样吗？",opts:["明显对你更特殊温柔","稍微对你好一点","差别不大","对你更冷淡"]},
    {title:"TA会不会向你吐露脆弱心事？",opts:["只愿意跟你倾诉心事","偶尔跟你说心里话","很少说内心想法","心事完全不和你说"]},
    {title:"TA会不会开玩笑撩你？",opts:["经常温柔撩你","偶尔开玩笑撩","只有朋友式玩笑","从不撩你"]},
    {title:"TA看到你消息，会不会拖着不回？",opts:["不会，有空就回","忙完会回你","经常拖延很久回","经常故意不回"]},
    {title:"你们聊天氛围？",opts:["轻松甜蜜，有说不完话","平淡舒服","容易冷场","聊天很压抑尴尬"]},
    {title:"TA会不会主动给你小礼物/小零食？",opts:["主动送小礼物零食","偶尔顺手带","你要才给","从来不会"]},
    {title:"TA会不会害怕失去你？",opts:["很怕失去你","有点在意会不会走","无所谓你离开","巴不得保持距离"]},
    {title:"综合感受：你觉得TA对你？",opts:["明显喜欢，藏不住好感","有好感但不敢行动","只是普通朋友礼貌","对你没有心动感觉"]}
]
const resultList = [
    {emoji:"💖",title:"双向奔赴｜TA超级喜欢你！",desc:"TA心里早就对你动心啦，一直悄悄留意你、惦记你，很多克制的温柔都是喜欢你的证据，大胆靠近，很容易修成正果！"},
    {emoji:"💗",title:"满心在意｜TA在偷偷暗恋你",desc:"TA默默喜欢你很久了，只是有点害羞不敢主动，很多细节都藏着偏爱，再多一点信号，TA就敢走向你。"},
    {emoji:"💕",title:"暧昧升温｜好感正在慢慢发芽",desc:"TA对你是有好感的，还在观望和适应阶段，不排斥靠近，持续好好相处，很容易从暧昧变成喜欢。"},
    {emoji:"💓",title:"友达以上｜有点心动但还犹豫",desc:"TA对你感觉不错，有一点点心动，但是还没到喜欢，还在权衡，需要更多契机拉近距离。"},
    {emoji:"💘",title:"温柔礼貌｜只是把你当很好的朋友",desc:"TA对你很好，但是更多是礼貌和友情，没有恋人方向的心动，适合保持舒服的朋友关系。"},
    {emoji:"🤍",title:"慢慢观望｜暂时没有心动信号",desc:"TA目前对你没有喜欢的感觉，对你比较平淡，不排斥但也没有主动靠近的欲望。"},
    {emoji:"🫧",title:"距离感｜TA只想保持边界",desc:"TA下意识和你保持距离，很多回应都是客气礼貌，不要过度解读TA的善意。"},
    {emoji:"☁️",title:"单向心动｜只有你在主动",desc:"这段关系大多是你在付出，TA没有同等的心意，及时止损，好好爱护自己。"},
    {emoji:"🌙",title:"忽冷忽热｜TA对你可有可无",desc:"TA无聊时找你，忙起来就忽略你，你不是TA优先选择的人，别陷太深。"},
    {emoji:"🍃",title:"无感状态｜TA对你没有想法",desc:"TA对你没有恋爱层面的好感，你的主动很难打动TA，把心意留给同样喜欢你的人吧。"}
]

let score = 0
let current = 0
function startTest(){
    document.getElementById('home').classList.add('hidden')
    document.getElementById('questionBox').classList.remove('hidden')
    showQ()
}
function showQ(){
    const q = questions[current]
    document.getElementById('qIndex').innerText = current+1
    document.getElementById('qTitle').innerText = q.title
    document.getElementById('progressBar').style.width = ((current+1)/32*100)+'%'
    let html = ''
    q.opts.forEach((opt,i)=>{
        let s = 3 - i
        html += `<div onclick="select(${s})" class="border border-pinkLight rounded-xl p-4 hover:bg-pinkLight cursor-pointer transition-all">${opt}</div>`
    })
    document.getElementById('optionList').innerHTML = html
}
function select(s){
    score += s
    current++
    if(current >= questions.length){
        showResult()
    }else{
        showQ()
    }
}
function showResult(){
    document.getElementById('questionBox').classList.add('hidden')
    document.getElementById('resultBox').classList.remove('hidden')
    let idx = Math.floor(score / (32*4 / resultList.length))
    idx = Math.min(idx, resultList.length-1)
    const r = resultList[idx]
    document.getElementById('resEmoji').innerText = r.emoji
    document.getElementById('resTitle').innerText = r.title
    document.getElementById('resDesc').innerText = r.desc
}
function restart(){
    score=0;current=0
    document.getElementById('resultBox').classList.add('hidden')
    document.getElementById('home').classList.remove('hidden')
}
</script>
</body>
</html>
